name: RTS quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Diagnose AI offense from initial resources
        run: npm run diagnose:ai -- --seconds=900 --interval=180
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  ai-offense:
    name: AI headless offensive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run opening-wave regression tests
        run: npx vitest run src/core/ai/AIController.test.ts
      - name: Replay natural-resource AI vs AI match
        run: npm run diagnose:ai -- --seed=123 --seconds=900 --interval=120 | tee ai-diagnostics.log
      - name: Run four seeded tournament games (20 minute cap)
        run: |
          npm run simulate -- --games=4 --seed=123 --max-seconds=1200 --out=reports-ci
          node -e "const r=require('./reports-ci/simulation-4games-seed123.json'); console.log(JSON.stringify({wins:r.wins,draws:r.draws,combats:r.matches.map(x=>({seed:x.seed,order:x.aiOrder,first:x.firstCombatSeconds,attacks:x.attacks,baseHp:x.baseHp}))},null,2))"
      - name: Save headless diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-offense-diagnostics
          path: |
            ai-diagnostics.log
            reports-ci/
          if-no-files-found: ignore
