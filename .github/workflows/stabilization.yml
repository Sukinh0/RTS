name: RTS V1.2 — CI and organic-map AI
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/v1-2-main-stabilization]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Prepare Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Collect failing browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v1-2-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  organic-map-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify AI tests against current MAP_ORGANIC_01
        run: npx vitest run src/core/ai/AIController.test.ts src/simulation/tournament.test.ts
      - name: Seeded organic-map tournament
        run: |
          npm run simulate -- --games=4 --seed=123 --max-seconds=1200 --out=reports-ci
          node -e "const r=require('./reports-ci/simulation-4games-seed123.json'); const n=r.matches.filter(m=>m.firstCombatSeconds!==null).length; const b=r.matches.filter(m=>m.firstBaseAttackSeconds!==null).length; console.log(JSON.stringify({wins:r.wins,draws:r.draws,combats:n,basePressure:b,matches:r.matches.map(m=>({seed:m.seed,order:m.aiOrder,winner:m.winner,first:m.firstCombatSeconds,firstBase:m.firstBaseAttackSeconds,damage:m.baseDamageDealt}))},null,2)); if(n===0)process.exit(1)"
      - name: Preserve tournament artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1-2-organic-ai-report
          path: reports-ci/
          if-no-files-found: ignore

  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build subpath-ready RTS preview
        run: npm run build
        env:
          RTS_BASE_PATH: /RTS/
      - uses: actions/upload-artifact@v4
        with:
          name: v1-2-rts-preview-dist
          path: dist/
          if-no-files-found: error
